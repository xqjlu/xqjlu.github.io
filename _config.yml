locale: "en-US"
title: "Qiang Xu"
title_separator: "-"
name: "Qiang Xu"
description: "Qiang Xu is a professor of physics at Jilin University developing efficient electronic-structure methods for large-scale condensed-matter simulations."
url: "https://xqjlu.github.io"
baseurl: ""
repository: "xqjlu/xqjlu.gitlab.io"
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"

comments:
  provider: false

twitter:
  username: "xuqiangjlu"

og_image: "profile.jpg"

social:
  type: "Person"
  name: "Qiang Xu"
  links:
    - "https://scholar.google.com/citations?hl=en&user=ZiwzYQsAAAAJ"
    - "https://github.com/xqjlu"
    - "https://orcid.org/0000-0003-3747-4325"

analytics:
  provider: false

author:
  name: "Dr. Qiang Xu"
  avatar: "profile.jpg"
  bio: "Professor of Physics"
  location: "Changchun"
  employer: "Jilin University"
  email: "xuq@jlu.edu.cn"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=ZiwzYQsAAAAJ&view_op=list_works&sortby=pubdate"
  github: "xqjlu"
  orcid: "https://orcid.org/0000-0003-3747-4325"
  twitter: "xuqiangjlu"

include:
  - _pages

exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - LICENSE
  - node_modules
  - package.json
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: "Asia/Shanghai"

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
